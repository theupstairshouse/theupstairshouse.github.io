
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Things I've Made | The Upstairs House</title>

  <style>
    :root {
      --cream: #E9D8C0;
      --paper: #F8EEDC;
      --olive: #555A3C;
      --brown: #493025;
      --pink: #B77F7D;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .stripes {
      height: 25px;
      background: repeating-linear-gradient(
        90deg,
        var(--olive) 0 28px,
        var(--pink) 28px 56px
      );
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 22px;
    }

    .note {
      background: var(--paper);
      padding: 45px 30px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      transform: rotate(-1deg);
      box-shadow: 4px 5px 10px #49302522;
    }

    h1 {
      font-family: Georgia, serif;
      color: var(--olive);
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    p { line-height: 1.8; }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 18px;
      background: var(--pink);
      color: var(--brown);
      text-decoration: none;
      transform: rotate(2deg);
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="stripes"></div>

  <main>
    <div class="note">
      <h1>Things I've Made</h1>

      <p>
        I'm gathering all my makes together...
      </p>

      <p>
        This page is still a work in progress.
        Pop back for updates!
      </p>

      <a href="index.html">← Back to The Upstairs House</a>
    </div>
  </main>

  <footer>✌🏻 The Upstairs House</footer>

  <div class="stripes"></div>
</body>
</html>
