
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Upstairs House</title>

  <style>
    :root {
  color-scheme: light;
  --cream: #E9D8C0;
  --paper: #F8EEDC;
  --olive: #555A3C;
  --brown: #493025;
  --pink: #B77F7D;
  --burgundy: #672E38;
}

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier New", monospace;
      line-height: 1.6;
    }

    .stripes {
      height: 25px;
      background: repeating-linear-gradient(
        90deg,
        var(--olive) 0 28px,
        var(--pink) 28px 56px
      );
    }

    nav {
      background: var(--paper);
      padding: 18px 12px;
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 5px;
    }

    a {
      color: var(--brown);
      text-decoration: none;
    }

    
nav a {
  font-size: clamp(9px, 2.7vw, 14px);
padding: 5px 6px;
white-space: nowrap;
  background: #D7BA8B;
  display: inline-block;
  transform: rotate(-2deg);
}

nav a:nth-child(2) {
  background: #C99B9A;
  transform: rotate(2deg);
}

nav a:nth-child(3) {
  background: #A8AD83;
  transform: rotate(-2deg);
}

nav a:nth-child(4) {
  background: #D7BA8B;
  transform: rotate(3deg);
}


    header {
      padding: 45px 20px 25px;
      text-align: center;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(38px, 8vw, 70px);
      line-height: 1.1;
      color: var(--olive);
      margin: 0 0 18px;
    }

    .subtitle {
      font-size: 17px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 25px 22px 65px;
    }

    .scrapbook {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 35px;
      align-items: center;
    }

    
.photo {
  background: #fffaf1;
  padding: 13px 13px 35px;
  position: relative;
  transform: rotate(-2deg);

  box-shadow:
    2px 3px 3px rgba(73, 48, 37, 0.12),
    8px 12px 18px rgba(73, 48, 37, 0.20),
    15px 22px 30px rgba(73, 48, 37, 0.10);
}


    
.photo::before {
  content: "";
  position: absolute;
  width: 105px;
  height: 30px;
  top: -13px;
  left: 50%;
  z-index: 2;

  transform: translateX(-50%) rotate(4deg);

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      rgba(255,255,255,0.09) 2px,
      transparent 4px
    ),
    rgba(184, 151, 91, 0.60);

  backdrop-filter: blur(1px);

  clip-path: polygon(
    0% 3%, 100% 0%,
    98% 100%, 2% 97%
  );

  box-shadow: 1px 2px 3px rgba(73,48,37,0.12);
}


    .photo img {
      width: 100%;
      display: block;
    }

    .note {
      background: var(--paper);
      padding: 30px;
      box-shadow: 4px 5px 10px #49302522;
      transform: rotate(2deg);
      font-size: 16px;
    }

    .note span {
      color: var(--burgundy);
      font-size: 30px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 65px;
    }

    .links a {
      padding: 23px 12px;
      text-align: center;
      font-weight: bold;
      background: var(--pink);
      border: 2px dashed var(--paper);
      font-size: 16px;
    }

    .links a:nth-child(2) {
      background: #85865C;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .scrapbook {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .note {
        font-size: 12px;
      }

      .links {
        grid-template-columns: 1fr;
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>
  <div class="stripes"></div>

  <nav>
    <a href="#home">Home</a>
    <a href="#made">Things I've Made</a>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
  </nav>

  <header id="home">
    <h1>The Upstairs House</h1>
    <p class="subtitle">
      Ceramics and other things I've made.
    </p>
  </header>

  <main>
    <section class="scrapbook">
      <div class="photo">
        <img src="IMG-20240628-WA0019.jpg"
             alt="Handmade ceramics by The Upstairs House">
      </div>

      <div class="note">
        somethings i make to keep...
        <br>
        somethings i make to gift...
        <br>
        somethings i might even sell...
        <br><span></span>
      </div>
    </section>

    <section class="links">
      <a id="made" href="#made">
        Things I've Made ↗
      </a>

      <a id="shop" href="#shop">
        Shop ↗
      </a>

      <a id="about" href="#about">
        About ↗
      </a>
    </section>
  </main>

  <footer>
    ✌🏻
    <br>
    The Upstairs House
  </footer>

  <div class="stripes"></div>
</body>
</html>
