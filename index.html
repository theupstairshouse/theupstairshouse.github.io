
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Upstairs House</title>

  <style>
    :root {
      color-scheme: light;
      --cream: #E9D8C0;
      --paper: #F8EEDC;
      --olive: #555A3C;
      --brown: #493025;
      --pink: #B77F7D;
      --burgundy: #672E38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier New", monospace;
      line-height: 1.6;
    }

    .stripes {
      height: 25px;
      background: repeating-linear-gradient(
        90deg,
        var(--olive) 0 28px,
        var(--pink) 28px 56px
      );
    }

    a {
      color: var(--brown);
      text-decoration: none;
    }

    header {
      padding: 55px 20px 20px;
      text-align: center;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(38px, 8vw, 70px);
      line-height: 1.1;
      color: var(--olive);
      margin: 0 0 18px;
    }

    .subtitle {
      font-size: 17px;
      margin-bottom: 30px;
    }

    .shop-button {
      display: inline-block;
      background: var(--pink);
      color: var(--brown);
      padding: 16px 38px;
      font-size: 20px;
      font-weight: bold;
      border: 2px dashed var(--paper);
      transform: rotate(-2deg);
      box-shadow: 4px 5px 0px #49302522;
      transition: transform 0.2s;
    }

    .shop-button:hover {
      transform: rotate(0deg) scale(1.03);
    }

    .delivery-note {
      font-size: 13px;
      margin-top: 15px;
      color: var(--olive);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin: 22px 0 0;
    }

    .social-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--brown);
      transition: transform 0.2s;
    }

    .social-icons a:hover {
      transform: rotate(-8deg) scale(1.1);
    }

    .social-icons svg {
      width: 27px;
      height: 27px;
      display: block;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 25px 22px 50px;
    }

    .photo {
      background: #fffaf1;
      padding: 13px 13px 35px;
      position: relative;
      transform: rotate(-2deg);

      box-shadow:
        2px 3px 3px rgba(73, 48, 37, 0.12),
        8px 12px 18px rgba(73, 48, 37, 0.20),
        15px 22px 30px rgba(73, 48, 37, 0.10);
    }

    .photo::before {
      content: "";
      position: absolute;
      width: 105px;
      height: 30px;
      top: -13px;
      left: 50%;
      z-index: 2;

      transform: translateX(-50%) rotate(4deg);

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          rgba(255,255,255,0.09) 2px,
          transparent 4px
        ),
        rgba(184, 151, 91, 0.60);

      backdrop-filter: blur(1px);

      clip-path: polygon(
        0% 3%, 100% 0%,
        98% 100%, 2% 97%
      );

      box-shadow: 1px 2px 3px rgba(73,48,37,0.12);
    }

    .photo img {
      width: 100%;
      display: block;
    }

    .little-note {
      text-align: center;
      margin-top: 45px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      header {
        padding-top: 40px;
      }

      .shop-button {
        font-size: 18px;
        padding: 15px 28px;
      }

      main {
        padding-top: 35px;
      }
    }
  </style>
</head>

<body>

  <div class="stripes"></div>

  <header>
    <h1>The Upstairs House</h1>

    <p class="subtitle">
      Handmade ceramics.
    </p>

    <a class="shop-button"
       href="https://shop.theupstairshouse.co.uk">
      SHOP MY MAKES ↗
    </a>

    <p class="delivery-note">
      ✳ Free UK delivery · UK orders only ✳
    </p>

    <div class="social-icons">

      <!-- Instagram -->
      <a
        href="https://www.instagram.com/theupstairshouse/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>

      <!-- TikTok -->
      <a
        href="https://www.tiktok.com/@the.upstairs.house"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
      >
        <svg
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d="M16.6 2c.25 2.2 1.5 3.6 3.8 3.75v3.6a9.2 9.2 0 0 1-3.8-1.05v6.3a6.6 6.6 0 1 1-6.6-6.6c.35 0 .7.03 1.05.09v3.75a3 3 0 1 0 1.9 2.76V2h3.65z"/>
        </svg>
      </a>

    </div>
  </header>

  <main>
    <div class="photo">
      <img src="IMG-20261116-WA0012(1).jpg"
           alt="Handmade ceramics by The Upstairs House">
    </div>

    <p class="little-note">
      Small batches. One-offs. Made by me.
    </p>
  </main>

  <footer>
    ✌🏻
    <br>
    The Upstairs House
  </footer>

  <div class="stripes"></div>

</body>
</html>
